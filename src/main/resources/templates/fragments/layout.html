<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">GroupBuy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="topbar(activeSection, workspaceId)">
    <a class="brand" th:href="@{/workspaces}">
        <span class="brand-mark">GB</span>
        <span>GroupBuy</span>
    </a>
    <nav class="nav">
        <a class="nav-link"
           th:classappend="${activeSection == 'workspaces'} ? ' nav-link-active'"
           th:href="@{/workspaces}">Workspaces</a>
        <a class="nav-link"
           th:if="${workspaceId != null}"
           th:classappend="${activeSection == 'purchase-items'} ? ' nav-link-active'"
           th:href="@{/purchase-items(workspaceId=${workspaceId})}">Позиции</a>
        <a class="nav-link"
           th:if="${workspaceId != null}"
           th:classappend="${activeSection == 'orders'} ? ' nav-link-active'"
           th:href="@{/orders(workspaceId=${workspaceId})}">Заказы</a>
        <a class="nav-link"
           th:classappend="${activeSection == 'profile'} ? ' nav-link-active'"
           th:href="@{/profile}"
           sec:authorize="isAuthenticated()">Профиль</a>
        <form class="ghost-form" th:action="@{/auth/logout}" method="post" sec:authorize="isAuthenticated()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="button-secondary" type="submit">Выйти</button>
        </form>
    </nav>
</header>
</body>
</html>
