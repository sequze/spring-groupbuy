<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar('purchase-items', ${purchaseItemForm.workspaceId})}"></header>

    <main class="editor-layout">
        <aside class="editor-aside panel">
            <div class="eyebrow">Новая позиция</div>
            <h1 class="page-title" th:text="${pageTitle}">Создание позиции закупки</h1>
            <p class="page-copy">Зафиксируйте, что именно нужно команде, в каком объеме и по какой цене это ожидается.</p>
        </aside>

        <section class="panel editor-panel">
            <form th:action="${formAction}" th:object="${purchaseItemForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-grid">
                    <div th:class="${canApproveImmediately} ? 'field' : 'field-full'">
                        <label for="workspaceId">Workspace</label>
                        <select id="workspaceId" th:field="*{workspaceId}">
                            <option th:each="workspace : ${workspaces}" th:value="${workspace.id}" th:text="${workspace.name}"></option>
                        </select>
                        <th:block th:replace="~{fragments/forms :: fieldError('workspaceId')}"></th:block>
                    </div>

                    <div class="field" th:if="${canApproveImmediately}">
                        <label for="approveImmediately">Модерация</label>
                        <label class="checkbox-field" for="approveImmediately">
                            <input id="approveImmediately" type="checkbox" th:field="*{approveImmediately}">
                            <span>Утвердить сразу</span>
                        </label>
                    </div>

                    <div class="field-full">
                        <label for="title">Название</label>
                        <input id="title" type="text" th:field="*{title}" placeholder="Например, офисные стулья">
                        <th:block th:replace="~{fragments/forms :: fieldError('title')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label for="description">Описание</label>
                        <textarea id="description" th:field="*{description}" rows="5" placeholder="Кратко опишите назначение и требования"></textarea>
                        <th:block th:replace="~{fragments/forms :: fieldError('description')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label for="productUrl">Ссылка на товар</label>
                        <input id="productUrl" type="url" th:field="*{productUrl}" placeholder="https://example.com/product">
                        <th:block th:replace="~{fragments/forms :: fieldError('productUrl')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="quantity">Количество</label>
                        <input id="quantity" type="number" min="1" th:field="*{quantity}">
                        <th:block th:replace="~{fragments/forms :: fieldError('quantity')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="unit">Единица измерения</label>
                        <input id="unit" type="text" th:field="*{unit}" placeholder="шт, кг, м">
                        <th:block th:replace="~{fragments/forms :: fieldError('unit')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="priceAmount">Цена</label>
                        <input id="priceAmount" type="number" step="0.01" min="0.01" th:field="*{priceAmount}">
                        <th:block th:replace="~{fragments/forms :: fieldError('priceAmount')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="priceCurrency">Валюта</label>
                        <input id="priceCurrency" type="text" th:field="*{priceCurrency}" placeholder="RUB">
                        <th:block th:replace="~{fragments/forms :: fieldError('priceCurrency')}"></th:block>
                    </div>

                    <div class="field-full">
                        <p class="muted">Базовая цена будет рассчитана в валюте приложения при сохранении.</p>
                    </div>
                </div>

                <div class="page-actions">
                    <button class="button" type="submit">Сохранить</button>
                    <a class="button-secondary" th:href="@{/purchase-items(workspaceId=${purchaseItemForm.workspaceId})}">Назад</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
