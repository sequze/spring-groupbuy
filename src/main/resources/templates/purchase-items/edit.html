<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar('purchase-items', ${purchaseItemForm.workspaceId})}"></header>

    <main class="editor-layout">
        <aside class="editor-aside panel">
            <div class="eyebrow">Редактирование</div>
            <h1 class="page-title" th:text="${pageTitle}">Редактирование позиции закупки</h1>
            <p class="page-copy">Автор редактирует содержимое заявки, а администратор workspace дополнительно может менять ее статус.</p>
            <div class="badge-row" th:if="${purchaseItem}">
                <span class="badge" th:text="'ID ' + ${purchaseItem.id}"></span>
                <span class="badge badge-accent" th:text="${purchaseItem.status}"></span>
            </div>
        </aside>

        <section class="panel editor-panel">
            <form th:action="${formAction}" th:object="${purchaseItemForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-grid">
                    <div class="field">
                        <label for="workspaceId">Workspace</label>
                        <select id="workspaceId" th:field="*{workspaceId}">
                            <option th:each="workspace : ${workspaces}" th:value="${workspace.id}" th:text="${workspace.name}"></option>
                        </select>
                        <th:block th:replace="~{fragments/forms :: fieldError('workspaceId')}"></th:block>
                    </div>

                    <div class="field" th:if="${canModerateStatus}">
                        <label for="status">Статус</label>
                        <select id="status" th:field="*{status}">
                            <option th:each="status : ${editStatuses}" th:value="${status}" th:text="${status}"></option>
                        </select>
                        <th:block th:replace="~{fragments/forms :: fieldError('status')}"></th:block>
                    </div>

                    <div class="field-full" th:if="${canModerateStatus}">
                        <label for="rejectionReason">Причина отклонения</label>
                        <textarea id="rejectionReason" th:field="*{rejectionReason}" rows="3" placeholder="Заполните, если выбираете статус REJECTED"></textarea>
                        <th:block th:replace="~{fragments/forms :: fieldError('rejectionReason')}"></th:block>
                    </div>

                    <div class="field" th:if="${!canModerateStatus}">
                        <label>Статус</label>
                        <input type="hidden" name="status" value="NEW">
                        <div class="checkbox-field">
                            <span class="badge badge-accent">NEW</span>
                            <span>При сохранении позиция останется новой</span>
                        </div>
                    </div>

                    <div class="field-full">
                        <label for="title">Название</label>
                        <input id="title" type="text" th:field="*{title}">
                        <th:block th:replace="~{fragments/forms :: fieldError('title')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label for="description">Описание</label>
                        <textarea id="description" th:field="*{description}" rows="5"></textarea>
                        <th:block th:replace="~{fragments/forms :: fieldError('description')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label for="productUrl">Ссылка на товар</label>
                        <input id="productUrl" type="url" th:field="*{productUrl}">
                        <th:block th:replace="~{fragments/forms :: fieldError('productUrl')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="quantity">Количество</label>
                        <input id="quantity" type="number" min="1" th:field="*{quantity}">
                        <th:block th:replace="~{fragments/forms :: fieldError('quantity')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="unit">Единица измерения</label>
                        <input id="unit" type="text" th:field="*{unit}">
                        <th:block th:replace="~{fragments/forms :: fieldError('unit')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="priceAmount">Цена</label>
                        <input id="priceAmount" type="number" step="0.01" min="0.01" th:field="*{priceAmount}">
                        <th:block th:replace="~{fragments/forms :: fieldError('priceAmount')}"></th:block>
                    </div>

                    <div class="field">
                        <label for="priceCurrency">Валюта</label>
                        <input id="priceCurrency" type="text" th:field="*{priceCurrency}">
                        <th:block th:replace="~{fragments/forms :: fieldError('priceCurrency')}"></th:block>
                    </div>

                    <div class="field-full" th:if="${purchaseItem}">
                        <p class="muted" th:if="${purchaseItem.basePriceAmount != null}" th:text="'Текущая базовая цена: ' + ${purchaseItem.basePriceAmount} + ' ' + (${purchaseItem.baseCurrency} ?: '')"></p>
                        <p class="muted" th:if="${purchaseItem.basePriceAmount == null}">Текущая базовая цена не указана.</p>
                    </div>
                </div>

                <div class="page-actions">
                    <button class="button" type="submit">Обновить</button>
                    <a class="button-secondary" th:href="@{/purchase-items(workspaceId=${purchaseItemForm.workspaceId})}">Назад</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
