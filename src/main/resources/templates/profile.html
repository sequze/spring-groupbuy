<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Профиль')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar('profile', ${null})}"></header>

    <main class="profile-layout">
        <aside class="profile-rail panel">
            <div class="eyebrow">Аккаунт</div>
            <h1 class="page-title">Профиль пользователя</h1>
            <p class="page-copy">Основные данные текущего пользователя.</p>
            <div class="page-actions">
                <a class="button" th:href="@{/workspaces}">К рабочим пространствам</a>
            </div>
        </aside>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2 class="section-title">Данные учетной записи</h2>
                    <p class="page-copy">Информация, которая отображается внутри workspace.</p>
                </div>
            </div>
            <div class="profile-grid">
                <dl class="profile-card">
                    <dt>ID</dt>
                    <dd th:text="${userId}"></dd>
                </dl>
                <dl class="profile-card">
                    <dt>Email</dt>
                    <dd th:text="${email}"></dd>
                </dl>
                <dl class="profile-card">
                    <dt>Имя</dt>
                    <dd th:text="${displayName}"></dd>
                </dl>
            </div>
        </section>
    </main>
</div>
</body>
</html>
