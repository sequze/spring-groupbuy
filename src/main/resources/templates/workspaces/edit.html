<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar('workspaces', ${workspace.id})}"></header>

    <main class="editor-layout">
        <aside class="editor-aside panel">
            <div class="eyebrow">Workspace</div>
            <h1 class="page-title" th:text="${pageTitle}">Редактирование workspace</h1>
            <p class="page-copy">Актуализируйте описание, статус и контекст пространства без потери существующих закупок.</p>
            <div class="badge-row" th:if="${workspace}">
                <span class="badge" th:text="'ID ' + ${workspace.id}"></span>
                <span class="badge badge-accent" th:text="${workspace.joinToken}"></span>
            </div>
        </aside>

        <section class="panel editor-panel">
            <form th:action="${formAction}" th:object="${workspaceForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-grid">
                    <div class="field-full">
                        <label for="name">Название</label>
                        <input id="name" type="text" th:field="*{name}">
                        <th:block th:replace="~{fragments/forms :: fieldError('name')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label for="description">Описание</label>
                        <textarea id="description" th:field="*{description}" rows="6"></textarea>
                        <th:block th:replace="~{fragments/forms :: fieldError('description')}"></th:block>
                    </div>

                    <div class="field-full">
                        <label class="checkbox-field" for="active">
                            <input id="active" type="checkbox" th:field="*{active}">
                            <span>Workspace активен и доступен участникам</span>
                        </label>
                    </div>
                </div>

                <div class="page-actions">
                    <button class="button" type="submit">Обновить</button>
                    <a class="button-secondary" th:href="@{/workspaces}">Назад</a>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
