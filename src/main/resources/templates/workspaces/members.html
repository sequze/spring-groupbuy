<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Участники - ' + ${workspace.name}">Участники workspace</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <a class="brand" th:href="@{/workspaces}">
            <span class="brand-mark">GB</span>
            <span>GroupBuy</span>
        </a>
        <nav class="nav">
            <a class="nav-link" th:href="@{/purchase-items(workspaceId=${workspace.id})}">Позиции</a>
            <a class="nav-link" th:href="@{/orders(workspaceId=${workspace.id})}">Заказы</a>
            <a class="nav-link" th:href="@{/workspaces}">Workspaces</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="analytics-hero">
            <article class="hero-card analytics-copy">
                <div class="eyebrow">Участники</div>
                <h1 class="page-title" th:text="${workspace.name}">Workspace</h1>
                <p class="page-copy" th:if="${workspace.description}" th:text="${workspace.description}"></p>
                <div class="badge-row">
                    <span class="badge" th:text="'ID ' + ${workspace.id}">ID</span>
                    <span class="badge badge-success" th:if="${workspace.active}">Активен</span>
                    <span class="badge badge-warning" th:if="${!workspace.active}">Отключен</span>
                </div>
            </article>
            <aside class="finance-tile panel">
                <span class="metric-label">Участников</span>
                <span class="metric-value" th:text="${#lists.size(members)}">0</span>
                <p class="metric-note">Пользователи текущего workspace.</p>
            </aside>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h2 class="section-title">Состав workspace</h2>
                    <p class="page-copy">Участники и их роли.</p>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(members)}">В workspace пока нет участников.</div>

            <div class="table-wrap" th:if="${!#lists.isEmpty(members)}">
                <table>
                    <thead>
                    <tr>
                        <th>Участник</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Присоединился</th>
                        <th>Пригласил</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="member : ${members}">
                        <td>
                            <div class="table-title" th:text="${member.displayName}">User</div>
                            <div class="badge-row section-spacer" th:if="${member.owner}">
                                <span class="badge badge-accent">Владелец</span>
                            </div>
                        </td>
                        <td th:text="${member.email}">email</td>
                        <td>
                            <span class="badge" th:text="${member.roleLabel}">Роль</span>
                        </td>
                        <td th:text="${#temporals.format(member.joinedAt, 'dd.MM.yyyy HH:mm')}">date</td>
                        <td th:text="${member.invitedByDisplayName ?: '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
