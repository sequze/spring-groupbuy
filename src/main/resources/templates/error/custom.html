<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/layout :: topbar('workspaces', ${null})}"></header>
    <main class="error-layout">
        <section class="hero-card error-card">
            <div class="eyebrow">Ошибка</div>
            <h1 class="page-title" th:text="${title}">Что-то пошло не так</h1>
            <p class="page-copy" th:text="${message}">Что-то пошло не так.</p>
            <div class="hero-actions">
                <a class="button" th:href="@{/workspaces}">Вернуться к workspaces</a>
                <a class="button-secondary" th:href="@{/profile}">Профиль</a>
            </div>
        </section>
    </main>
</div>
</body>
</html>
